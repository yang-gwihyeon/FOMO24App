name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 린트는 리눅스 러너에서 수 초. macOS 러너(10배 과금·느린 큐)를 스타일 검사에 쓰지 않는다.
  # 도입 시점 기준선: error 5 (앱 코드 강제 언래핑) — 카드형 PR로 0이 되면 continue-on-error 를 제거한다.
  lint:
    name: SwiftLint (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/realm/swiftlint:0.65.0
    continue-on-error: true   # TODO(baseline): 기존 error 0 달성 후 제거 → 블로킹 게이트로 전환
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  format:
    name: SwiftFormat 검사 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # swiftformat 이미지는 셸이 없어 `container:` 잡으로 못 띄움(Docker start fail) → docker run 으로 실행
      - name: SwiftFormat --lint
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/nicklockwood/swiftformat:0.63.0 --lint . --reporter github-actions-log

  test-and-build:
    name: 모듈 테스트 + 앱 빌드
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tuist·xcbeautify 설치
        run: brew install tuist xcbeautify

      - name: CI용 더미 GoogleService-Info.plist 생성
        run: cp CI/GoogleService-Info.example.plist GoogleService-Info.plist

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Project.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 프로젝트 생성 (tuist generate)
        run: tuist generate --no-open

      - name: 시뮬레이터 선택
        id: sim
        # 이름 매칭은 런타임이 여러 개면 모호성 오류가 나므로 UDID로 지정
        run: |
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -m1 -oE '[0-9A-F-]{36}')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: 모듈 유닛테스트 (FOMOCore + MarketKit)
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace FOMO24.xcworkspace \
            -scheme Modules \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: 앱 빌드 (FOMO24 + 위젯)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace FOMO24.xcworkspace \
            -scheme FOMO24 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
