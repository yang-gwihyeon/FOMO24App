name: Release (TestFlight)

# 두 가지 트리거 → 아카이브 → TestFlight 자동 업로드
#  1) v1.1 형식 태그 푸시: git tag v1.1 && git push origin v1.1  (최종 릴리즈)
#  2) 수동 실행(version 입력): gh workflow run release.yml -f version=1.1  (테스트 빌드 — 태그 없이)
# 빌드 번호는 항상 run_number → 같은 버전으로 여러 번 올려도 충돌 없음
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "마케팅 버전 (예: 1.5) — 태그 없이 TestFlight 빌드"
        required: true
        type: string

jobs:
  testflight:
    name: 아카이브 + TestFlight 업로드
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tuist·xcbeautify 설치
        run: brew install tuist xcbeautify

      - name: 실제 GoogleService-Info.plist 복원 (Secret)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: echo "$PLIST_B64" | base64 --decode > GoogleService-Info.plist

      - name: 버전 주입 + 프로젝트 생성 (태그 v1.1 → 1.1)
        env:
          TUIST_BUILD_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # 수동 실행이면 입력값, 태그 푸시면 태그(v 제거)
          export TUIST_MARKETING_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "MARKETING_VERSION=$TUIST_MARKETING_VERSION, BUILD=$TUIST_BUILD_NUMBER"
          tuist install 2>/dev/null || true
          tuist generate --no-open

      - name: App Store Connect API 키 복원 (Secret)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 아카이브 (클라우드 자동 서명)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace FOMO24.xcworkspace \
            -scheme FOMO24 \
            -destination 'generic/platform=iOS' \
            -archivePath build/FOMO24.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: TestFlight 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/FOMO24.xcarchive \
            -exportOptionsPlist CI/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify
