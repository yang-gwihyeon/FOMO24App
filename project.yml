name: FOMO24
options:
  bundleIdPrefix: com.yang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  Phosphor:
    url: https://github.com/phosphor-icons/swift
    from: "2.0.0"

targets:
  FOMO24:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFirestore
      - package: Phosphor
        product: PhosphorSwift
      - target: FOMO24Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yang.FOMO24
        DEVELOPMENT_TEAM: "33YSUT6XZ3"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: FOMO24.entitlements
      properties:
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FOMO24
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FOMO24Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Models/PriceActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yang.FOMO24.Widgets
        DEVELOPMENT_TEAM: "33YSUT6XZ3"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: FOMO24
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
